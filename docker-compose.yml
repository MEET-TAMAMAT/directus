version: '3.8'

services:
  directus:
    image: directus/directus:latest
    ports:
      - 8055:8055
    volumes:
      - ./extensions:/directus/extensions
      - directus_uploads:/directus/uploads
    environment:
      KEY: '255d861b-5ea1-5996-9aa3-922530ec40b1'
      SECRET: '6116487b-cda1-52c2-b5b5-c8022c45e263'
      DB_CLIENT: 'pg'
      DB_HOST: 'database'
      DB_PORT: '5432'
      DB_DATABASE: 'directus'
      DB_USER: 'directus'
      DB_PASSWORD: 'directus'
      ADMIN_EMAIL: 'meet.tamamat@gmail.com'
      ADMIN_PASSWORD: 'NewPass123!'
      PUBLIC_URL: 'http://localhost:8055'
      EXTENSIONS_PATH: '/directus/extensions'
      CORS_ENABLED: 'true'
      CORS_ORIGIN: 'http://localhost:3000,https://localhost:3000,http://localhost:5173,https://localhost:5173,http://127.0.0.1:3000,http://192.168.0.100:3000,http://192.168.0.100:5173'
    depends_on:
      - database

  database:
    image: postgres:18
    environment:
      POSTGRES_USER: 'directus'
      POSTGRES_PASSWORD: 'directus'
      POSTGRES_DB: 'directus'
      PGDATA: '/var/lib/postgresql/data/18/docker'
    volumes:
      - directus_data:/var/lib/postgresql/data

volumes:
  directus_data:
  directus_uploads:
